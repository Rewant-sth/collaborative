<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="setting.css">
</head>
<body>
    <div class="settings-menu">

        <div class="settings-item" data-bs-toggle="modal" data-bs-target="#editProfileModal">
            <i class="bi bi-person"></i>
            Edit Profile
        </div>
        <div class="settings-item" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
            <i class="bi bi-lock"></i>
            Change Password
        </div>
        <div class="settings-item delete-account" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
            <i class="bi bi-trash"></i>
            Delete Account
        </div>
        <div class="settings-item" data-bs-toggle="modal" data-bs-target="#logoutModal">
            <i class="bi bi-box-arrow-right"></i>
            Logout
        </div>
    </div>

    <!-- Edit pro part -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="edit profile"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" value="rewant" title="rewant">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" value="rewant@gmail.com" title="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" title="phone">
                        </div>
                        <button type="submit" class="btn btn-primary w-100" title="save">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Change password part -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Change Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="pw"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Current Password</label>
                            <input type="password" class="form-control" title="cp">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">New Password</label>
                            <input type="password" class="form-control" title="np">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm New Password</label>
                            <input type="password" class="form-control" title="cnp">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete account part -->
    <div class="modal fade" id="deleteAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Delete Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="da"></button>
                </div>
                <div class="modal-body">
                    <p class="text-center mb-4">Are you sure you want to delete your account? This action cannot be undone.</p>
                    <div class="mb-3">
                        <label class="form-label">Enter your password to confirm</label>
                        <input type="password" class="form-control" title="pw">
                    </div>
                    <button class="btn btn-danger w-100">Delete Account</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Logout part -->
    <div class="modal fade" id="logoutModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" title="logout"></button>
                </div>
                <div class="modal-body">
                    <p class="text-center mb-4">Are you sure you want to logout?</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary w-50" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-primary w-50">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
